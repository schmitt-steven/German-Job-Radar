<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Job Radar</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #2b3334;
      --muted: #6b7280;
      --accent: #25ebeb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1e;
        --text: #f3f4f6;
        --muted: #af9c9c;
      }
    }
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      cursor: default;
      user-select: none;
    }
    main { text-align: center; }
    .spinner {
      width: 32px;
      height: 32px;
      margin: 0 auto 16px;
      border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error { display: none; max-width: 420px; }
    #error p { color: var(--muted); }
    body.failed #loading { display: none; }
    body.failed #error { display: block; }
  </style>
</head>
<body>
  <main id="loading">
    <div class="spinner"></div>
    <div>Job Radar wird gestartet…</div>
  </main>
  <main id="error">
    <strong>Job Radar konnte nicht starten.</strong>
    <p>Details stehen in <code>jobradar.log</code> im App-Datenordner. Schließe das Fenster und versuche es erneut.</p>
  </main>
  <script>
    // The shell navigates to #failed when the backend can't start
    function update() {
      document.body.classList.toggle('failed', location.hash === '#failed');
    }
    window.addEventListener('hashchange', update);
    update();
  </script>
</body>
</html>
