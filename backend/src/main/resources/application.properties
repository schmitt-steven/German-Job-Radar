spring.application.name=german-job-radar

server.address=127.0.0.1
server.port=42420

spring.data.web.pageable.default-page-size=50

spring.datasource.url=jdbc:sqlite:${jobradar.data-dir}/jobradar.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=true

logging.file.name=${jobradar.data-dir}/jobradar.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB
